name: CI — Verificación del proyecto

# `pull_request` cubre todas las ramas de trabajo: nada llega a master sin pasar
# por una PR. `push` se limita a master y a las ramas de integración, para no
# ejecutar cada comprobación dos veces.
on:
  push:
    branches: [main, master, 'integration/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  #  DOCUMENTACIÓN
  #
  #  Comprueba que el proyecto está documentado y es honesto sobre su estado.
  #  Verde aquí significa «la documentación está en orden», NO «el producto
  #  funciona».
  # ═══════════════════════════════════════════════════════════════════════
  documentacion:
    name: Documentación y estado del proyecto
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que existen los archivos obligatorios
        run: |
          obligatorios="README.md SYSTEM_VISION.md PROJECT_STATUS.md CLAUDE.md .claude/CLAUDE.md \
            docs/ESTADOS_DEL_PROYECTO.md docs/ARQUITECTURA.md docs/INTEGRACIONES.md \
            docs/MANTENIMIENTO.md docs/GETTING-STARTED.md docs/ROADMAP.md docs/CHANGELOG.md \
            .env.example"
          falta=0
          for f in $obligatorios; do
            if [ -f "$f" ]; then echo "  ✅ $f"; else echo "  ❌ FALTA: $f"; falta=1; fi
          done
          [ "$falta" -eq 0 ] || { echo "Faltan archivos obligatorios."; exit 1; }

      - name: PROJECT_STATUS declara una etapa
        # La búsqueda es SIN distinguir mayúsculas: en Markdown `[x]` y `[X]`
        # marcan la casilla igual, y el documento usa la minúscula. Con la
        # búsqueda estricta, este control fallaba sobre un documento correcto.
        run: |
          if grep -qiE '^- \[x\] ' PROJECT_STATUS.md; then
            echo "Etapa declarada:"
            grep -iE '^- \[x\] ' PROJECT_STATUS.md
          else
            echo "::error::PROJECT_STATUS.md no marca ninguna etapa."
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════
  #  PRIVACIDAD
  #
  #  Este software toca documentos sanitarios. Este job existe para que un
  #  descuido no acabe en el repositorio.
  # ═══════════════════════════════════════════════════════════════════════
  privacidad:
    name: Nada clínico ni secreto en el repositorio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No hay documentos ni imágenes fuera de lo permitido
        run: |
          # Los PDF e imágenes solo pueden vivir en sitios declarados.
          sospechosos=$(git ls-files | grep -iE '\.(pdf|jpg|jpeg|png|tif|tiff|dcm|heic)$' \
            | grep -vE '^(docs/assets/|apps/desktop/build/|packages/extraction/fixtures/sinteticos/)' || true)
          if [ -n "$sospechosos" ]; then
            echo "::error::Hay documentos o imágenes en sitios no permitidos:"
            echo "$sospechosos"
            exit 1
          fi
          echo "✅ Sin documentos ni imágenes fuera de lo permitido."

      - name: No hay sesiones, claves ni datos de OCR
        run: |
          prohibidos=$(git ls-files | grep -iE '(storagestate|storage-state|\.env$|\.pem$|\.key$|\.pfx$|traineddata|cookies\.json)' || true)
          if [ -n "$prohibidos" ]; then
            echo "::error::Hay ficheros que nunca deben subirse:"
            echo "$prohibidos"
            exit 1
          fi
          echo "✅ Sin sesiones, claves ni datos de OCR."

      - name: La carpeta local/ no está versionada
        run: |
          if git ls-files | grep -qE '^local/'; then
            echo "::error::La carpeta local/ contiene material de trabajo y no debe versionarse."
            git ls-files | grep -E '^local/'
            exit 1
          fi
          echo "✅ local/ fuera del repositorio."

  # ═══════════════════════════════════════════════════════════════════════
  #  CALIDAD
  #
  #  Este job SÍ comprueba que el código funciona: estilo, tipos, tests y que
  #  la aplicación se construye.
  # ═══════════════════════════════════════════════════════════════════════
  calidad:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Tipos (TypeScript estricto)
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Los tests contra Kane, EVO y Barrett NO están aquí, y es a propósito.
      # Una web ajena con un mal día pondría este control en rojo por algo que
      # no es nuestro, y un control que falla por motivos ajenos deja de
      # mirarse. Se lanzan a mano con `pnpm live`.
      - name: Recordatorio sobre las webs externas
        run: |
          echo "::notice::Este control NO prueba Kane, EVO ni Barrett. Para eso: pnpm live"

  # ═══════════════════════════════════════════════════════════════════════
  #  INTERFAZ
  #
  #  Arranca Electron de verdad y recorre el flujo pulsando con el ratón.
  # ═══════════════════════════════════════════════════════════════════════
  interfaz:
    name: Prueba de interfaz (Electron)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Dependencias de sistema de Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libgbm1 libasound2t64 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2

      # Hace falta de verdad, no «por si acaso»: dos de las pruebas de interfaz
      # suben un documento, y leer un documento arranca Chromium para rasterizar
      # las páginas del PDF. Sin este paso esas dos fallan con «Executable
      # doesn't exist», y solo en el CI — en un ordenador de trabajo el navegador
      # ya está instalado de antes, así que el fallo no se ve en local.
      - name: Descargar el Chromium que usan la lectura de documentos y los adaptadores
        run: pnpm playwright:install

      - name: Construir la aplicación
        run: pnpm build

      - name: Prueba de interfaz
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Guardar el rastro si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-prueba-interfaz
          path: apps/desktop/test-results/
          retention-days: 7
